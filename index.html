    s.state = 'loading';

  }

    return list.map((c) => {
      const s = C[c];
      if (s.buf && s.state === 'fetched') {
        try { engine.copyToFS('/tmp/rb_' + c + '.pck', s.buf); s.buf = null; s.state = 'ready'; }
        catch (e) { console.error('[RB] chunk mount ' + c, e); }
      }
      const f = pack + '_' + c + '.pck';
      return c + ':' + s.state + ':' + (s.state === 'ready' ? 1 : (prog[f] || 0)).toFixed(3) + ':' + (GZ[f].gz || 1);
    }).join(';');
  };
})();
