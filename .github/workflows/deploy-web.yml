# Build the Web version with Godot (desktop + mobile packs) and publish it to GitHub Pages
# (gh-pages branch) on every push to main. Run it by hand from the Actions tab as well.
name: Build & deploy web

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  # size-optimized engine template (tools/engine); cached, so normally a minute
  engine:
    uses: ./.github/workflows/web-engine.yml

  web:
    needs: engine
    # still deploy (with the official template) if the engine template could not be built
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Engine template from the engine job
        id: tpl
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: web-template-*
          merge-multiple: true
          path: ~/rb-template

      - name: Cache Godot + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && chmod +x godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz && rm templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Brotli cache (engine parts; tools/package_web.py)
        uses: actions/cache@v4
        with:
          path: ~/.cache/rb_brotli
          key: rb-brotli-${{ github.run_id }}
          restore-keys: rb-brotli-

      - name: Build (import, desktop pack, mobile ETC2 pack, download chunks, gzip/Brotli parts)
        run: |
          export GODOT=~/godot/godot
          export BUILD_ID="$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}"
          if [ -f ~/rb-template/web_nothreads_release.zip ]; then
            export RB_WEB_TEMPLATE=~/rb-template/web_nothreads_release.zip
          else
            echo "::warning::no size-optimized engine template; exporting with the official one"
          fi
          bash tools/build_web.sh
          test -f build/web_hosted/index.html
          # core packs + download chunks (tools/split_pck.py, scripts/data/pack_chunks.gd)
          for c in menu stage1 towers world; do
            test -f build/web_hosted/index_${c}.pck.gz0.bin
            test -f build/web_hosted/index_mobile_${c}.pck.gz0.bin
          done
          test -f build/web_hosted/index.wasm.br0.bin
          ls -la build/web_hosted

      - name: Checks (every string has English, fonts cover all text, scenes load only chunks they wait for, every dialog closes, heroes spawn clear, waves follow the balance curve)
        run: |
          export GODOT=~/godot/godot
          pip install --quiet fonttools
          python3 tools/i18n_build.py --check
          python3 tools/make_fonts.py --check
          bash tools/check_chunks.sh
          bash tools/check_sheets.sh
          bash tools/check_spawn.sh
          bash tools/check_balance.sh

      - name: Browser smoke test (headless Chrome plays the built page; nothing is published if it fails)
        run: |
          pip install --quiet playwright
          python3 tools/browser_test.py build/web_hosted /tmp/smoke 1280 720 --play --nosw --smoke

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web_hosted
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy web build ${{ github.sha }}"
